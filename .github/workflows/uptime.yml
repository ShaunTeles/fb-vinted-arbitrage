name: n8n uptime check

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping n8n health endpoint
        run: |
          for attempt in 1 2 3; do
            if curl -sf --max-time 30 https://n8n-production-924f.up.railway.app/healthz > /dev/null; then
              echo "n8n is up (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          echo "n8n is DOWN after 3 attempts"
          exit 1

      - name: Send Telegram alert
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="🚨 n8n on Railway is DOWN — https://n8n-production-924f.up.railway.app is not responding. Open the Railway dashboard and redeploy the n8n service." > /dev/null
